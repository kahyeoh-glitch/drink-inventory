<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drink Inventory</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Drink Inventory</h1>
        <p class="subtitle">Bottled drinks sold at Grain</p>
      </header>

      <div class="date-picker">
        <label for="sale-date">Date</label>
        <input id="sale-date" type="date" />
        <span id="total-summary" class="total-summary"></span>
      </div>

      <p id="error" class="error" hidden></p>
      <p id="range-note" class="range-note" hidden></p>

      <table id="drinks-table" hidden>
        <thead>
          <tr>
            <th>Drink</th>
            <th>Quantity sold</th>
          </tr>
        </thead>
        <tbody id="drinks-body"></tbody>
      </table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
